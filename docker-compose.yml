services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aurapilates
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    # Bind to loopback only — avoids Internet scanners hammering Postgres on :5432.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - aurapilates_db:/var/lib/postgresql/data

  web:
    build:
      context: .
      args:
        # Loaded from project `.env` for `docker compose` variable substitution.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/aurapilates
      PRISMA_MIGRATE: "1"
    ports:
      - "3000:3000"

volumes:
  aurapilates_db:

