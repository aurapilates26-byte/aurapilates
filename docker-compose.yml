services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aurapilates
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - aurapilates_db:/var/lib/postgresql/data

  web:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/aurapilates
      AUTH_SECRET: change_me_in_production
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      STAFF_QR_KEY_HASH: replace_with_sha256_hash
      ADMIN_LOGIN_EMAIL: admin@votre-studio.fr
      SEED_ADMIN_PASSWORD: changez_moi_en_production
      PRISMA_MIGRATE: "1"
    ports:
      - "3000:3000"

volumes:
  aurapilates_db:

